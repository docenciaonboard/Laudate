:root{
  --paper:#EEF0F3; --surface:#FFFFFF; --sunk:#E3E6EB; --ink:#161A22; --muted:#5A6272; --line:#D3D8E0;
  --accent:#8A1C3A; --accent-ink:#FFFFFF; --accent-soft:#F5E4E9; --chord:#8A1C3A;
  --f-display:'Alegreya',Georgia,'Times New Roman',serif; --f-ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1217; --surface:#171B22; --sunk:#0B0D11; --ink:#E9ECF1; --muted:#9AA2B1; --line:#2A303B;
  --accent:#E58AA3; --accent-ink:#22070F; --accent-soft:#3A1822; --chord:#F0A3B8; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1217; --surface:#171B22; --sunk:#0B0D11; --ink:#E9ECF1; --muted:#9AA2B1; --line:#2A303B;
  --accent:#E58AA3; --accent-ink:#22070F; --accent-soft:#3A1822; --chord:#F0A3B8; color-scheme:dark;}
html,body{background:var(--paper);color:var(--ink);}
.app{font-family:var(--f-ui);background:var(--paper);color:var(--ink);}
.font-display{font-family:var(--f-display);}
.bg-paper{background:var(--paper)} .bg-surface{background:var(--surface)} .bg-sunk{background:var(--sunk)}
.bg-accent{background:var(--accent);color:var(--accent-ink)} .bg-accent-soft{background:var(--accent-soft)}
.text-ink{color:var(--ink)} .text-muted{color:var(--muted)} .text-accent{color:var(--accent)}
.border-line{border-color:var(--line)} .border-accent{border-color:var(--accent)}
.ctl{border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.ctl:hover{border-color:var(--muted)} .ctl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:.6rem .75rem;font-size:16px}
.field:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button:focus-visible,a:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent)}
.tabnum{font-variant-numeric:tabular-nums}
/* ChordPro */
.cp{font-family:var(--f-ui);line-height:1.25}
.cp-line{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.3em}
.cp-word{display:inline-flex;white-space:nowrap}
.cp-piece{display:inline-flex;flex-direction:column}
.cp-chord{color:var(--chord);font-weight:700;font-size:.86em;padding-right:.45em;white-space:nowrap;line-height:1.35}
.cp-text{white-space:pre}
.cp-label{font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:.5em}
.cp-gap{height:.85em}
.cp-chorus{border-left:3px solid var(--accent);padding-left:.75em}
/* Atril: siempre oscuro y de alto contraste, sin depender del tema */
.live{background:#000;color:#F4F4F2;--chord:#FFD24A;--accent:#FFD24A;--muted:#8E9AAB}
.live .cp-chord{font-size:.8em}
.live-btn{background:#16181C;color:#F4F4F2;border:1px solid #2C3038}
.live-btn:hover{background:#22252B}
.live-btn[aria-pressed="true"]{background:#FFD24A;color:#000;border-color:#FFD24A}
.live input[type=range]{accent-color:#FFD24A}
